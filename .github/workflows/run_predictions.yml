name: Daily Football Predictions

on:
  schedule:
    - cron: '0 */6 * * *' # Τρέχει αυτόματα κάθε 6 ώρες (00:00, 06:00, 12:00, 18:00)
  workflow_dispatch: # Επιτρέπει τη χειροκίνητη εκτέλεση όποτε θες εσύ

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Δίνει δικαίωμα στο ρομποτάκι να γράφει και να ανανεώνει το αρχείο

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run prediction model
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add daily_predictions.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update predictions"
          git push

