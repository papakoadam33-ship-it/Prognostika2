name: Daily Football Predictions

on:
  schedule:
    - cron: '0 8 * * *' # Τρέχει αυτόματα κάθε μέρα στις 11:00 ώρα Ελλάδος
  workflow_dispatch: # Σου επιτρέπει να το τρέχεις χειροκίνητα με κουμπί

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run prediction script
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add daily_predictions.txt
        git commit -m "Auto-updated daily predictions" || echo "No changes to commit"
        git push origin main
