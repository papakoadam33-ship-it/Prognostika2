name: Daily Football Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run prediction script
      run: python main.py

    # 🚀 ΤΟ ΕΞΥΠΝΟ ΕΡΓΑΛΕbranch ΠΟΥ ΚΑΝΕΙ PUSH ΧΩΡΙΣ ΣΦΑΛΜΑΤΑ
    - name: Commit and Push changes automatically
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update predictions & statistics"
        file_pattern: 'daily_predictions.txt history.json'
