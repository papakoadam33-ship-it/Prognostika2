name: Daily Football Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Τρέχει αυτόματα κάθε πρωί

jobs:
  build:
    runs-on: ubuntu-latest

    # 🔑 ΑΥΤΗ Η ΓΡΑΜΜΗ ΞΕΚΛΕΙΔΩΝΕΙ ΤΟ ΣΦΑΛΜΑ 128
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run prediction script
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add daily_predictions.txt history.json || true
        git commit -m "Auto-update predictions & statistics" || true
        git push origin main
