name: Daily Football Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run prediction script
      run: python main.py

    # 🔑 ΚΑΘΑΡΟ PUSH ΜΕ ΤΟ ΕΤΟΙΜΟ ΚΛΕΙΔΙ ΑΣΦΑΛΕΙΑΣ ΤΟΥ GITHUB
    - name: Commit and Push changes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add daily_predictions.txt history.json || true
        git commit -m "Auto-update predictions & statistics" || true
        git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git main

