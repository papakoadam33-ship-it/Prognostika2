name: Daily Football Predictions

on:
  schedule:
    - cron: '0 5 * * *' # Τρέχει αυτόματα κάθε μέρα στις 08:00 το πρωί ώρα Ελλάδος
  workflow_dispatch: # Σου επιτρέπει να το τρέχεις και χειροκίνητα όποτε θες

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run prediction engine
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add daily_predictions.txt
        git commit -m "Auto-updated daily predictions" || exit 0
        git push

