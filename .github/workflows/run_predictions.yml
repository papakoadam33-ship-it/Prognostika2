name: Daily Football Predictions

on:
  schedule:
    - cron: '0 0 * * *' # Τρέχει αυτόματα κάθε μέρα στις 12 το βράδυ
  workflow_dispatch: # Επιτρέπει τη χειροκίνητη εκτέλεση

jobs:
  build:
    runs-on: ubuntu-latest
    
    # ΑΥΤΟ ΕΔΩ ΕΙΝΑΙ ΤΟ ΚΛΕΙΔΙ: Δίνει ρητά δικαίωμα εγγραφής στο ρομποτάκι
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Run prediction model
      run: python main.py

    - name: Commit and push changes
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add daily_predictions.txt
        git commit -m "Auto-updated predictions" || exit 0
        git push
