name: Daily Football Predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Δίνει ρητά δικαίωμα εγγραφής στο token του job

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true  # Κρατάει τα δικαιώματα για το push

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run prediction script
      run: python main.py

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add daily_predictions.txt history.json || true
        git commit -m "Auto-update predictions & statistics" || true
        git push origin main
