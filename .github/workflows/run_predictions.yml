name: Daily Football Predictions

on:
  schedule:
    - cron: '0 5 * * *' # Τρέχει αυτόματα κάθε μέρα στις 08:00 πρωί ώρα Ελλάδας
  workflow_dispatch: # Σου επιτρέπει να το τρέχεις και χειροκίνητα με κουμπί

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run prediction script
      run: python main.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add daily_predictions.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data update" && git push)
